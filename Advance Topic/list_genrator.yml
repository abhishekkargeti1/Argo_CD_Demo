apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-list
  namespace: argocd
spec:
  # The list generator lets you enumerate a static set of elements (apps).
  generators:
    - list:
        elements:
          - app: chat-app-backend
            path: argocd/Declarative/Backend Yml file     # path in repo for this app
          - app: chat-app-frontend
            path: argocd/Declarative/Frontend Yml file      # path in repo for this app
  # Template that will be used to generate individual Application CRs
  template:
    metadata:
      # name template uses the element key 'app'
      name: '{{app}}-list'
    spec:
      project: default
      source:
        repoURL: https://github.com/abhishekkargeti1/Argo_CD_Demo.git
        targetRevision: main
        path: '{{path}}'                # resolved from element
      destination:
        server: https://172.31.19.108:33893
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
